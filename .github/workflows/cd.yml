name: CD - Deploy Contínuo

on:
  push:
    branches:
      - main

jobs:
  publish-docker:
    name: Publicar imagem no GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extrair metadados da imagem
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build e push da imagem do backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extrair metadados da imagem frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build e push da imagem do frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          target: frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-pages:
    name: Deploy Frontend via GitHub Pages (HTTPS)
    runs-on: ubuntu-latest
    needs: publish-docker
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Preparar arquivos do frontend
        run: |
          mkdir -p _site
          cp -r game/* _site/
          echo "Deploy realizado em $(date)" >> _site/deploy-info.txt

      - name: Upload dos arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4