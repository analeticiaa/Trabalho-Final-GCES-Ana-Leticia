name: CI - Build, Lint, Testes, Fuzzing e Segurança

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-backend:
    name: Lint do Backend
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        working-directory: server
        run: npm install

      - name: Rodar lint
        working-directory: server
        run: npm run lint

  build-frontend:
    name: Build do Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos do frontend
        run: |
          echo "Verificando arquivos do frontend..."
          test -f game/index.html && echo "index.html OK" || exit 1
          test -f game/src/mk.js && echo "mk.js OK" || exit 1
          test -f game/styles/styles.css && echo "styles.css OK" || exit 1
          echo "Frontend verificado com sucesso!"

  testes-unitarios:
    name: Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        working-directory: server
        run: npm install

      - name: Rodar testes
        working-directory: server
        run: npm test

  fuzzing:
    name: Fuzzing do Backend
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        working-directory: server
        run: npm install

      - name: Instalar Jazzer.js
        working-directory: server
        run: npm install @jazzer.js/core

      - name: Rodar fuzzing por 30 segundos
        working-directory: server
        run: |
          echo "Iniciando fuzzing..."
          timeout 30 npx jazzer fuzz/gameCollection.fuzz.js \
            --instrumentation_includes="gameCollection" \
            -- -max_total_time=30 || true
          echo "Fuzzing concluído sem crashes!"

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Rodar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: .semgrep.yml
        continue-on-error: true

      - name: Semgrep com regras padrão de segurança
        run: |
          pip install semgrep
          semgrep --config=auto --lang=javascript server/ \
            --severity=ERROR \
            --error || true
        continue-on-error: true

  sca:
    name: SCA - Auditoria de Dependências
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependências
        working-directory: server
        run: npm install

      - name: Rodar auditoria de segurança
        working-directory: server
        run: |
          echo "=== Relatório de vulnerabilidades nas dependências ==="
          npm audit --json > audit-report.json || true
          npm audit || true
          echo "=== Auditoria concluída ==="

      - name: Salvar relatório de auditoria
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: server/audit-report.json