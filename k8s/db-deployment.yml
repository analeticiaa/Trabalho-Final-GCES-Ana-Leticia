apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: mkjs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: mkjs
            - name: POSTGRES_PASSWORD
              value: mkjs123
            - name: POSTGRES_DB
              value: mkjs
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "mkjs"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: mkjs
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432