apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mkjs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: trabalho-final-gces-ana-pereira-app:latest
          imagePullPolicy: Never
          env:
            - name: DB_HOST
              value: db
            - name: DB_USER
              value: mkjs
            - name: DB_PASSWORD
              value: mkjs123
            - name: DB_NAME
              value: mkjs
            - name: NODE_ENV
              value: production
          ports:
            - containerPort: 55555
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mkjs
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 55555
      targetPort: 55555
      nodePort: 30555